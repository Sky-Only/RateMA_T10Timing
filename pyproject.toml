[project]
name = "ratema-t10timing"
version = "0.1.0"
description = "基于 20/120 日简单移动均线的利率择时策略回测（标的：中债-10年期国债净价(总值)指数 CBA04502.CS）"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "matplotlib>=3.11.2",
]

[project.scripts]
ratema = "ratema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratema"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# 关闭 cacheprovider，避免在被限制的环境里创建 pytest-cache-files-* 目录
# 临时目录由 tests/conftest.py 覆盖到项目内的 build/pytest-tmp
addopts = "-q -p no:cacheprovider"

# --------------------------------------------------------------------------- #
# 代码质量
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", ".uv-cache", "build", "output", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未定义/未使用）
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff 自有规则
    "PTH",  # 优先使用 pathlib
    "RET",  # return 语句简化
]
ignore = [
    "E501",    # 行长由 formatter 负责
    "B905",    # zip(strict=) 在 3.11 可用但非必需
    "RUF001",  # 中文全角标点会被误报为「歧义字符」
    "RUF002",
    "RUF003",
    "RUF005",  # 列表拼接可读性更好
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "PTH"]
"scripts/*" = ["E402", "PTH"]

[tool.mypy]
python_version = "3.11"
files = ["src/ratema"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# pandas / matplotlib 的类型桩不完整，先不要求全注解
disallow_untyped_defs = false
